services:
  - type: web
    name: mythology-internal-video-controlplane
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: INTERNAL_VIDEO_SERVICE_API_KEY
        generateValue: true
      - key: HF_VIDEO_ENDPOINT_URL
        sync: false
      - key: HF_VIDEO_ENDPOINT_TOKEN
        sync: false
